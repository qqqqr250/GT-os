[package]
name = "rustos-test-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Runs the RustOS kernel's in-QEMU test binaries"
license = "MIT OR Apache-2.0"
publish = false

# This is a standalone workspace on purpose: cargo invokes it through the
# `runner` hook while the outer workspace build is still in flight, so it must
# not share the outer workspace's build lock.
[workspace]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bootloader = "0.11.12"
