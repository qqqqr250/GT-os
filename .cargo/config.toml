[unstable]
# Lets the root crate depend on the kernel binary as a build artifact
# (nightly-only Cargo feature, see the README).
bindeps = true

# The software crypto backends are selected explicitly: the x86 runtime feature
# dispatch in `aes`, `polyval` and `sha2` hits an LLVM backend bug on this
# bare-metal target. `sha2/force-soft` is enabled in the kernel manifest.
[target.x86_64-unknown-none]
rustflags = ["--cfg", "aes_force_soft", "--cfg", "polyval_force_soft"]
