[package]
name = "gtos-allocator-designs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "blog_os post-11, done properly: a minimal bare-metal kernel with bump, linked-list and fixed-size block heap allocators"
license = "MIT"
publish = false

# Standalone on purpose: this teaching crate must not join the GTos workspace,
# so it can be built and tested on its own (its `cargo test` boots QEMU, see the
# crate README).
[workspace]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

# The library holds the kernel, the GDT/TSS, the IDT, the device drivers, the
# paging API and the three allocator designs. Like the post-04..post-10 examples
# it is *always* `no_std`: every test runs inside QEMU through the custom test
# framework, not on the host.
[lib]
name = "gtos_allocator_designs"
path = "src/lib.rs"

# The bootable kernel binary, built for `x86_64-unknown-none`.
[[bin]]
name = "gtos-allocator-designs"
path = "src/main.rs"
test = false
bench = false

# The in-QEMU integration test (`tests/allocator_designs.rs`, run with
# `scripts\allocator-designs.ps1 -Test` or `cargo qtest`).
[[test]]
name = "allocator_designs"

# The post-12 async hook: the `task` module's two executors and the async
# keyboard stream are exercised through the crate's public API.
[[test]]
name = "task"

[dependencies]
bootloader_api = "0.11.12"
# Post-12's `Stream`/`StreamExt` traits and `AtomicWaker`. The bounded queue and
# the once-cell the post also uses are hand-written in `src/sync`.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# The linked-list allocator the post's own fixed-size block design falls back to
# for allocations larger than its biggest block class — and the design the
# `linked_list` module reimplements by hand for comparison.
linked_list_allocator = "0.10.5"
spin = "0.9.8"
x86_64 = "0.15.2"

# The kernel is freestanding: it must not try to unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
