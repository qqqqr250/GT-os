[package]
name = "rustos-async-await"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "blog_os post-12, done properly: a minimal bare-metal kernel with async/await, an executor and an async keyboard"
license = "MIT OR Apache-2.0"
publish = false

# Standalone on purpose: this teaching crate must not join the RustOS workspace,
# so it can be built and tested on its own (its `cargo test` boots QEMU, see the
# crate README).
[workspace]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

# The library holds the kernel, the GDT/TSS, the IDT, the device drivers, the
# paging API, the allocator designs and the post-12 task module. Like the
# post-04..post-11 examples it is *always* `no_std`: every test runs inside QEMU
# through the custom test framework, not on the host.
[lib]
name = "rustos_async_await"
path = "src/lib.rs"

# The bootable kernel binary, built for `x86_64-unknown-none`.
[[bin]]
name = "rustos-async-await"
path = "src/main.rs"
test = false
bench = false

# The in-QEMU integration test (`tests/async_await.rs`, run with
# `scripts\async-await.ps1 -Test` or `cargo qtest`).
[[test]]
name = "async_await"

[dependencies]
bootloader_api = "0.11.12"
# The linked-list allocator the fixed-size block design falls back to for
# allocations larger than its biggest block class.
linked_list_allocator = "0.10.5"
spin = "0.9.8"
x86_64 = "0.15.2"

# post-12's supporting types. The tutorial takes its bounded queue, once-cell and
# waker from `crossbeam-queue`, `conquer-once` and `futures-util`; this crate
# hand-writes the queue and the once-cell (see `src/sync/`) and takes only the
# `Stream` trait and `AtomicWaker` from `futures-util`, with `default-features`
# off so nothing from `std` is pulled in.
[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["alloc"]

# The kernel is freestanding: it must not try to unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
