[package]
name = "rustos-cpu-exceptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "blog_os post-05, done properly: a minimal bare-metal kernel with a tested interrupt descriptor table"
license = "MIT"
publish = false

# Standalone on purpose: this teaching crate must not join the RustOS workspace,
# so it can be built and tested on its own (its `cargo test` boots QEMU, see the
# crate README).
[workspace]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

# The library holds the kernel and the IDT. Like the post-04 example it is
# *always* `no_std`: every test runs inside QEMU through the custom test
# framework, not on the host.
[lib]
name = "rustos_cpu_exceptions"
path = "src/lib.rs"

# The bootable kernel binary, built for `x86_64-unknown-none`.
[[bin]]
name = "rustos-cpu-exceptions"
path = "src/main.rs"
test = false
bench = false

# The in-QEMU integration test (`tests/breakpoint.rs`, run with
# `scripts\cpu-exceptions.ps1 -Test` or `cargo qtest`).
[[test]]
name = "breakpoint"

# The post-07 hardware-interrupt hook: the PIC/PIT setup in `interrupts::init`
# drives a timer, and this test asserts the tick count advances.
[[test]]
name = "timer"

# The post-08 paging hook: the `memory` module's mapper, table walk and frame
# allocator are exercised through the crate's public API.
[[test]]
name = "paging"

# The post-10 heap hook: the `allocator` module's heap is mapped through the
# paging layer and exercised through the crate's public API.
[[test]]
name = "heap_allocation"

# The post-12 async hook: the `task` module's two executors and the async
# keyboard stream are exercised through the crate's public API.
[[test]]
name = "task"

[dependencies]
bootloader_api = "0.11.12"
# Post-12's `Stream`/`StreamExt` traits and `AtomicWaker`. The bounded queue and
# the once-cell the post also uses are hand-written in `src/sync`.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# The heap itself: a linked-list allocator behind a spin lock, the same crate the
# real kernel uses.
linked_list_allocator = "0.10.5"
spin = "0.9.8"
x86_64 = "0.15.2"

# The kernel is freestanding: it must not try to unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
